name: Deploy to Railway

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check RAILWAY_TOKEN
        id: railway_token
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  RAILWAY_TOKEN not configured. Skipping Railway deployment."
            echo "To enable auto-deploy:"
            echo "1. Get token from the Railway dashboard (Settings → Tokens)"
            echo "2. Add RAILWAY_TOKEN secret to GitHub repo (Settings → Secrets → New)"
            exit 0
          fi
          echo "has_token=true" >> "$GITHUB_OUTPUT"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy to Railway
        if: steps.railway_token.outputs.has_token == 'true'
        run: |
          npm install -g @railway/cli
          railway up --service WhatSalesAgent --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Report deployment status
        if: success() && steps.railway_token.outputs.has_token == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'Railway Deployment',
              description: 'Deployment to Railway successful',
              target_url: 'https://railway.com'
            })

      - name: Report deployment failure
        if: failure() && steps.railway_token.outputs.has_token == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'Railway Deployment',
              description: 'Deployment to Railway failed',
              target_url: 'https://railway.com'
            })
